<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Newsletter Builder – Brillengroßhandel</title>
<style>
/* ─── RESET ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --acc: #e87722;
  --dark: #0f172a;
  --mid: #334155;
  --muted: #64748b;
  --border: #e2e8f0;
  --bg: #f8fafc;
}
html, body { height: 100%; overflow: hidden; }
body {
  font-family: -apple-system, 'Segoe UI', Arial, sans-serif;
  font-size: 13px;
  color: var(--dark);
  background: var(--bg);
  display: flex;
  flex-direction: column;
}

/* ─── TOP BAR ────────────────────────────────────────── */
.topbar {
  background: var(--dark);
  height: 52px;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  flex-shrink: 0;
}
.topbar-logo { font-size: 15px; font-weight: 900; color: var(--acc); letter-spacing: 2px; text-transform: uppercase; }
.topbar-logo span { color: white; }
.topbar-sub { font-size: 11px; color: #475569; margin-left: -4px; }
.topbar-spacer { flex: 1; }
.btn {
  padding: 7px 16px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.15s;
  white-space: nowrap;
}
.btn:hover { opacity: 0.82; }
.btn-primary { background: var(--acc); color: white; }
.btn-ghost { background: transparent; color: #94a3b8; border: 1px solid #334155; }
.btn-ghost:hover { color: white; opacity: 1; border-color: #64748b; }

/* ─── LAYOUT ─────────────────────────────────────────── */
.main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

/* ─── SIDEBAR ────────────────────────────────────────── */
.sidebar {
  width: 310px;
  min-width: 260px;
  background: white;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
}
.sidebar::-webkit-scrollbar { width: 5px; }
.sidebar::-webkit-scrollbar-thumb { background: #e2e8f0; border-radius: 3px; }

.sect {
  border-bottom: 1px solid var(--border);
  padding: 14px 16px;
}
.sect-title {
  font-size: 9.5px;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #94a3b8;
  margin-bottom: 10px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.sect-badge {
  background: var(--acc);
  color: white;
  font-size: 9px;
  font-weight: 700;
  padding: 1px 6px;
  border-radius: 10px;
}

.field-label {
  display: block;
  font-size: 11px;
  font-weight: 600;
  color: var(--mid);
  margin-bottom: 3px;
  margin-top: 9px;
}
.field-label:first-child { margin-top: 0; }

input[type=text], input[type=number], textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 6px 10px;
  font-size: 12px;
  color: var(--dark);
  background: white;
  outline: none;
  font-family: inherit;
}
input[type=text]:focus, input[type=number]:focus, textarea:focus {
  border-color: var(--acc);
  box-shadow: 0 0 0 2px rgba(232,119,34,0.12);
}
textarea { resize: vertical; min-height: 60px; line-height: 1.5; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

/* Checkboxes */
.check-group { display: flex; flex-direction: column; gap: 5px; }
.check-grid  { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
.check-row {
  display: flex; align-items: center; gap: 7px; cursor: pointer;
  padding: 4px 6px; border-radius: 5px; transition: background 0.1s;
}
.check-row:hover { background: #f8fafc; }
.check-row input[type=checkbox] { width: 14px; height: 14px; accent-color: var(--acc); cursor: pointer; flex-shrink: 0; }
.check-row span { font-size: 12px; color: var(--mid); user-select: none; }

.mini-btns { display: flex; gap: 5px; margin-bottom: 7px; }
.mini-btn {
  font-size: 10px; padding: 2px 8px; border: 1px solid var(--border);
  border-radius: 4px; background: none; cursor: pointer; color: #64748b;
  transition: border-color 0.15s, color 0.15s;
}
.mini-btn:hover { border-color: var(--acc); color: var(--acc); }

/* Model list */
.model-list { display: flex; flex-direction: column; gap: 4px; }
.model-item {
  display: flex; align-items: center; gap: 8px;
  padding: 8px 10px; border: 1px solid var(--border);
  border-radius: 7px; cursor: pointer;
  transition: border-color 0.15s, background 0.15s;
}
.model-item:hover { border-color: #cbd5e1; background: #fafafa; }
.model-item.on { border-color: var(--acc); background: #fff8f3; }
.model-item input[type=checkbox] { accent-color: var(--acc); cursor: pointer; flex-shrink: 0; width: 14px; height: 14px; }
.model-item-info { flex: 1; min-width: 0; }
.model-brand { font-size: 9.5px; font-weight: 700; color: var(--acc); text-transform: uppercase; letter-spacing: 0.5px; }
.model-name  { font-size: 12px; font-weight: 700; color: var(--dark); }
.model-sub   { font-size: 10px; color: #94a3b8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.no-models   { font-size: 12px; color: #94a3b8; text-align: center; padding: 20px 0; }

/* ─── PREVIEW ────────────────────────────────────────── */
.preview-pane {
  flex: 1; overflow: hidden;
  display: flex; flex-direction: column;
  background: #e2e8f0;
}
.preview-bar {
  background: #f8fafc; border-bottom: 1px solid var(--border);
  padding: 7px 16px; font-size: 11px; color: #94a3b8;
  display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.preview-bar strong { color: var(--mid); }
.preview-frame { flex: 1; width: 100%; border: none; display: block; }

/* ─── STATUS ─────────────────────────────────────────── */
.status { background: #f0fdf4; border-top: 1px solid #bbf7d0; height: 26px; padding: 0 16px; font-size: 11px; color: #16a34a; display: none; align-items: center; justify-content: center; flex-shrink: 0; }
.status.show { display: flex; }
</style>
</head>

    <!-- MODELLE -->

      <div class="sect-title">
        Modelle auswählen
        <span class="sect-badge" id="sel-count">0</span>
      </div>
      <div class="mini-btns">
        <button class="mini-btn" onclick="selectAllModels(true)">Alle</button>

// ════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════
const selected = new Set();

// ════════════════════════════════════════════════════
//  INIT
// ════════════════════════════════════════════════════
function init() {
  // Marken-Checkboxen aufbauen
  const mc = document.getElementById('marken-cb');
  mc.innerHTML = DATEN.map(m => `
    <label class="check-row">
      <input type="checkbox" data-marke value="${m.id}" checked onchange="rebuildList()">
      <span>${m.name}</span>
    </label>`).join('');

  // Alle Modelle vorausgewählt
  DATEN.forEach(m => m.modelle.forEach(mod => selected.add(mod.id)));
  rebuildList();
}

// ════════════════════════════════════════════════════
//  FILTER HELPERS
// ════════════════════════════════════════════════════
function vals(sel) { return [...document.querySelectorAll(sel + ':checked')].map(el => el.value); }

function filtered() {
  const marken = vals('[data-marke]');
  const zg     = vals('[data-zg]');
  const mat    = vals('[data-mat]');
  const out = [];
  DATEN.forEach(m => {
    if (!marken.includes(m.id)) return;
    m.modelle.forEach(mod => {
      if (mat.includes(mod.mat) && zg.some(g => mod.zg.includes(g)))
        out.push({ marke: m, mod });
    });
  });
  return out;
}

// ════════════════════════════════════════════════════
//  MODEL LIST
// ════════════════════════════════════════════════════
const MAT_L = { AC:'Acetat', ES:'Edelstahl', KU:'Kunststoff', TI:'Titan' };
const ZG_L  = { KIDS:'Kinder', JU:'Jugendl.', DA:'Damen', HE:'Herren', UNI:'Unisex' };

function rebuildList() {
  const list = document.getElementById('model-list');
  const items = filtered();
  if (!items.length) {
    list.innerHTML = '<div class="no-models">Keine Modelle für diese Filter.</div>';
    document.getElementById('sel-count').textContent = '0';
    refresh(); return;
  }
  list.innerHTML = items.map(({ marke: m, mod }) => {
    const on = selected.has(mod.id);
    const sub = mod.zg.map(g => ZG_L[g]||g).join(', ') + ' · ' + (MAT_L[mod.mat]||mod.mat) + ' · ' + fmtPreis(mod.preis);
    return `<div class="model-item ${on?'on':''}" data-id="${mod.id}" onclick="toggleMod('${mod.id}',this)">
      <input type="checkbox" ${on?'checked':''} onclick="event.stopPropagation();toggleMod('${mod.id}',this.closest('.model-item'))">
      <div class="model-item-info">
        <div class="model-brand">${m.name}</div>
        <div class="model-name">${mod.nr}</div>
        <div class="model-sub">${sub}</div>
      </div>
    </div>`;
  }).join('');
  updateCount();
  refresh();
}

function toggleMod(id, el) {
  selected.has(id) ? selected.delete(id) : selected.add(id);
  el.classList.toggle('on', selected.has(id));
  el.querySelector('input').checked = selected.has(id);
  updateCount();
  refresh();
}

function updateCount() {
  document.getElementById('sel-count').textContent = selected.size;
}

function selectAllModels(on) {
  filtered().forEach(({ mod }) => on ? selected.add(mod.id) : selected.delete(mod.id));
  rebuildList();
}

function toggleAll(cbSel, on) {
  document.querySelectorAll(cbSel + ' input').forEach(el => el.checked = on);
  rebuildList();
}

// ════════════════════════════════════════════════════
//  PLACEHOLDER IMAGE
// ════════════════════════════════════════════════════
const FK_BG = {
  gruen:'#dcfce7', pink:'#fce7f3', lila:'#f3e8ff', orange:'#ffedd5',
  tuerkes:'#ccfbf1', rot:'#fee2e2', blau:'#dbeafe', dunkelblau:'#dbeafe',
  schwarz:'#f1f5f9', braun:'#fef3c7', silber:'#f8fafc', gold:'#fefce8',
  gunmetal:'#e2e8f0', default:'#f8fafc',
};
const FK_TC = {
  gruen:'#166534', pink:'#9d174d', lila:'#6b21a8', orange:'#c2410c',
  tuerkes:'#0f766e', rot:'#991b1b', blau:'#1d4ed8', dunkelblau:'#1e3a8a',
  schwarz:'#475569', braun:'#78350f', silber:'#64748b', gold:'#a16207',
  gunmetal:'#475569', default:'#64748b',
};

function placeholder(fk, farbe) {
  const bg = FK_BG[fk]||FK_BG.default;
  const tc = FK_TC[fk]||FK_TC.default;
  const txt = farbe.length > 20 ? farbe.slice(0,20)+'…' : farbe;
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='200' height='105'>
  <rect width='200' height='105' fill='${bg}' rx='6'/>
  <g transform='translate(14,22)'>
    <rect x='0'   y='8' width='68' height='44' rx='12' fill='none' stroke='${tc}' stroke-width='4.5' opacity='.45'/>
    <rect x='104' y='8' width='68' height='44' rx='12' fill='none' stroke='${tc}' stroke-width='4.5' opacity='.45'/>
    <path d='M68 30 Q86 26 104 30' fill='none' stroke='${tc}' stroke-width='3.5' opacity='.45'/>
    <line x1='0' y1='30' x2='-16' y2='22' stroke='${tc}' stroke-width='3.5' opacity='.45'/>
    <line x1='172' y1='30' x2='188' y2='22' stroke='${tc}' stroke-width='3.5' opacity='.45'/>
  </g>
  <text x='100' y='90' text-anchor='middle' font-size='10.5' font-family='Arial,sans-serif' fill='${tc}' font-weight='600'>${esc(txt)}</text>
</svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtPreis(p) { return p.toFixed(2).replace('.',',') + ' €'; }

//  PREVIEW + DOWNLOAD
// ════════════════════════════════════════════════════
function refresh() {
  document.getElementById('preview').srcdoc = buildHTML();
}

function downloadHTML() {
  const kw   = document.getElementById('kw').value;
  const jahr = document.getElementById('jahr').value;
  const html = buildHTML();
  const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `newsletter_KW${kw}_${jahr}.html`;
  document.body.appendChild(a); a.click(); a.remove();
  showStatus(`newsletter_KW${kw}_${jahr}.html heruntergeladen!`);
}

function showStatus(msg) {
  const s = document.getElementById('status');
  s.textContent = '✓ ' + msg;
  s.classList.add('show');
  setTimeout(() => s.classList.remove('show'), 4000);
}

function resetAll() {
  document.getElementById('kw').value = 33;
  document.getElementById('jahr').value = 2026;
  document.getElementById('thema').value = 'Kinder & Jugendliche';
  document.getElementById('intro').value = 'Liebe Augenoptiker:innen, liebe Freunde,\ndiese Woche präsentieren wir Ihnen unsere aktuelle Kollektion für Kinder und Jugendliche.';
  document.getElementById('abschluss').value = 'Wir wünschen Ihnen eine erfolgreiche Woche und freuen uns auf Ihre Bestellung!';
  selected.clear();
  DATEN.forEach(m => m.modelle.forEach(mod => selected.add(mod.id)));
  document.querySelectorAll('[data-marke],[data-zg],[data-mat]').forEach(el => el.checked = true);
  rebuildList();
}
